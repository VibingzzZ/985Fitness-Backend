spring:
  profiles:
    active: local
  application:
    name: 985Fitness-boot
  datasource:
    url: jdbc:mysql://localhost:3306/985fitness
    username: root
    # password → 在 application-local.yaml 中配置
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

server:
  port: 8080
