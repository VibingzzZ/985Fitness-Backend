spring:
  profiles:
    active: local
  application:
    name: 985Fitness-boot
  datasource:
    url: jdbc:mysql://localhost:3306/985fitness
    username: root
    # password → 在 application-local.yaml 中配置
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 2h
    refresh-token-expiration: 30d
  user-data:
    phone-encryption-key: ${USER_PHONE_ENCRYPTION_KEY}
server:
  port: 8080
wechat:
  mini-program:
    app-id: ${WECHAT_APP_ID:}
    secret: ${WECHAT_APP_SECRET:}
