name: Branch Policy

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate source branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Allow develop or hotfix branches only
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == hotfix/* ]]; then
            exit 0
          fi

          echo "Only develop or hotfix/* may target main."
          echo "Current source branch: $HEAD_REF"
          exit 1
