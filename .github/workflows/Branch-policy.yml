name: Branch Policy

on:
  pull_request:
    branches: [main, release]

permissions:
  pull-requests: read

jobs:
  validate-source:
    name: Validate source branch
    runs-on: ubuntu-latest

    steps:
      - name: Allow develop or hotfix branches only
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == hotfix/* ]]; then
            exit 0
          fi

          echo "Only develop or hotfix/* may target main or release."
          echo "Current source branch: $HEAD_REF"
          exit 1
