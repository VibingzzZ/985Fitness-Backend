name: Secret Scan

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan pull request for verified secrets
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@d31c04eaf9c226b5a1563cdc5b500b9bd5072b53
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Scan pushed commits for verified secrets
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@d31c04eaf9c226b5a1563cdc5b500b9bd5072b53
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
