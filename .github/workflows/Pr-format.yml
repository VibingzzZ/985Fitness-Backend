name: PR Format

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-metadata:
    name: Validate PR title and description
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          title_pattern='^(feat|fix|docs|refactor|test|build|ci|chore)(\([^)]+\))?!?: .+'

          if [ "${#PR_TITLE}" -gt 50 ]; then
            echo "PR title must not exceed 50 characters."
            exit 1
          fi

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "Invalid PR title: $PR_TITLE"
            echo "Expected: feat(scope): description"
            exit 1
          fi

          if [ -z "$(echo "$PR_BODY" | tr -d '[:space:]')" ]; then
            echo "PR description must not be empty."
            exit 1
          fi
