name: PR Format

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-metadata:
    name: Validate PR title and description
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          title_pattern='^(feat|fix|docs|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+'

          if [ "${#PR_TITLE}" -gt 50 ]; then
            echo "PR title must not exceed 50 characters."
            exit 1
          fi

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "Invalid PR title: $PR_TITLE"
            echo "Expected: feat(scope): description"
            exit 1
          fi

          if [ -z "$(echo "$PR_BODY" | tr -d '[:space:]')" ]; then
            echo "PR description must not be empty."
            exit 1
          fi

  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Fetch PR commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --paginate > commits.json

      - name: Validate commit format
        run: |
          header_pattern='^(feat|fix|docs|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+'
          invalid=0

          while IFS= read -r encoded; do
            message=$(printf '%s' "$encoded" | base64 --decode)
            header=$(printf '%s\n' "$message" | head -n 1)
            second_line=$(printf '%s\n' "$message" | sed -n '2p')
            body=$(printf '%s\n' "$message" | tail -n +3 | tr -d '[:space:]')

            if [ "${#header}" -gt 50 ]; then
              echo "Commit title exceeds 50 characters: $header"
              invalid=1
              continue
            fi

            if [[ ! "$header" =~ $header_pattern ]]; then
              echo "Invalid commit title: $header"
              invalid=1
              continue
            fi

            if [ -n "$second_line" ]; then
              echo "A blank line is required after commit title: $header"
              invalid=1
              continue
            fi

            if [ -z "$body" ]; then
              echo "Commit body is required: $header"
              invalid=1
            fi
          done < <(jq -r '.[].commit.message | @base64' commits.json)

          exit "$invalid"